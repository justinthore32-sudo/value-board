<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — ValueBoard</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<script>
  if (localStorage.getItem("valueboard_theme") === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1 style="display:flex; align-items:center; justify-content:center; gap:10px;"><img src="favicon.svg" alt="" style="width:30px; height:30px;"> ValueBoard</h1>
    <p class="caption">Tableau de bord d'aide à la décision pour le value investing</p>

    <div id="loading" class="info-box" style="margin-bottom:16px; font-size:13px;">Connexion au serveur…</div>

    <div id="create-mode" style="display:none;">
      <p class="caption" style="margin-bottom:8px;">Premier lancement : crée le compte (un seul compte par Worker).</p>
      <form id="create-form">
        <label for="c-username">Nom d'utilisateur</label>
        <input type="text" id="c-username" required>
        <label for="c-password">Mot de passe</label>
        <input type="password" id="c-password" required>
        <label for="c-password2">Confirme le mot de passe</label>
        <input type="password" id="c-password2" required>
        <div id="create-error"></div>
        <button type="submit" style="width:100%; margin-top:16px;">Créer et se connecter</button>
      </form>
    </div>

    <div id="login-mode" style="display:none;">
      <form id="login-form">
        <label for="l-username">Nom d'utilisateur</label>
        <input type="text" id="l-username" required>
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" required>
        <div id="login-error"></div>
        <button type="submit" style="width:100%; margin-top:16px;">Se connecter</button>
      </form>
    </div>

    <div id="server-error" class="error-box" style="display:none; margin-top:14px;"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  try {
    const exists = await accountExists();
    document.getElementById("loading").style.display = "none";
    document.getElementById("create-mode").style.display = exists ? "none" : "block";
    document.getElementById("login-mode").style.display = exists ? "block" : "none";
  } catch (err) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("server-error").style.display = "block";
    document.getElementById("server-error").textContent = `Impossible de joindre le serveur : ${err.message}`;
  }
})();

document.getElementById("create-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("c-username").value.trim();
  const password = document.getElementById("c-password").value;
  const password2 = document.getElementById("c-password2").value;
  const errorBox = document.getElementById("create-error");
  errorBox.innerHTML = "";

  if (!username || !password) {
    errorBox.innerHTML = '<div class="error-box" style="margin-top:10px;">Nom d\'utilisateur et mot de passe obligatoires.</div>';
    return;
  }
  if (password !== password2) {
    errorBox.innerHTML = '<div class="error-box" style="margin-top:10px;">Les deux mots de passe ne correspondent pas.</div>';
    return;
  }
  try {
    await setupAccount(username, password);
    window.location.href = "index.html";
  } catch (err) {
    errorBox.innerHTML = `<div class="error-box" style="margin-top:10px;">${err.message}</div>`;
  }
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("l-username").value.trim();
  const password = document.getElementById("l-password").value;
  const errorBox = document.getElementById("login-error");
  errorBox.innerHTML = "";
  try {
    await login(username, password);
    window.location.href = "index.html";
  } catch (err) {
    errorBox.innerHTML = `<div class="error-box" style="margin-top:10px;">${err.message}</div>`;
  }
});
</script>
</body>
</html>
